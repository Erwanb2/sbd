[project]
name = "sbd"
version = "0.1.0"
description = "API Backend pour l'analyse de Deadlift avec Gemini"
requires-python = "==3.11.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "google-genai",
    "pydantic",
    "sqlmodel>=0.0.22",
    "google-auth>=2.56.3",
    "pyjwt>=2.13.0",
    "opencv-python-headless>=4.10,<5",
    "pillow>=12.3.0",
    "mediapipe==0.10.21",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
]
