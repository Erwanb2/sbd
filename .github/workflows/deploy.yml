name: Deploy to OVH VPS (Direct)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
          GLOBAL_ENV: ${{ secrets.GLOBAL_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: BACKEND_ENV,FRONTEND_ENV,GLOBAL_ENV
          script: |
            set -e
            cd /home/ubuntu/sbd
            
            echo "📥 Mise à jour du code source..."
            git fetch origin main
            git reset --hard origin/main

            echo "⚙️ Mise à jour des fichiers d'environnement..."
            echo "$BACKEND_ENV" > backend/.env
            echo "$FRONTEND_ENV" > frontend/.env
            echo "$GLOBAL_ENV" > .env

            echo "🚀 Démarrage et reconstruction des conteneurs..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Nettoyage des images inutilisées..."
            docker image prune -f

            echo "✅ Déploiement terminé avec succès !"